 {id:'mixed',title:'中風後又持續健忘',tag:'混合病因',

 {level:'basic',topic:'安全關卡',stem:'82 歲長者昨天起突然混亂、發燒，家屬想先了解是哪一型失智。最適當的處理是：',opts:['優先評估急性病因，暫停亞型判讀','先完成認知篩檢，再決定是否就醫','先整理 14 項危險因子，下週回診','先安排 AD 血液生物標記確認病因'],ans:0,why:'數小時到數天內的混亂與急性疾病是警訊，要先評估譫妄與急性病因。工具此時會暫停亞型判讀。',src:'本工具規則；NICE NG97 1.2.32'},
 {level:'basic',topic:'安全關卡',stem:'四項安全問題中三項答「無」，「快速惡化」答「不清楚」。工具應如何處理？',opts:['視同「無」，放行亞型整理','視同「有」，直接建議住院','只顯示 AD 與 DLB 兩個方向','視為檢核未完成，暫不進行亞型判讀'],ans:3,why:'不清楚不等於沒有。四題都有明確回答且全部否認，才會放行亞型整理。',src:'本工具規則'},
 {level:'basic',topic:'症候群',stem:'正式評估已證實客觀認知障礙。要區分 MCI 與失智症症候群，關鍵是確認：',opts:['MMSE 是否低於固定的診斷切點','日常獨立性是否因認知下降受影響','MRI 是否有海馬迴萎縮','是否帶有 APOE ε4'],ans:1,why:'MCI 與失智症的界線在獨立生活功能，且必須是認知下降造成，而非單純肢體或感官障礙。',src:'本工具規則；DETeCD-ADRD'},
 {level:'basic',topic:'認知篩檢',stem:'家屬描述明顯退步，但簡短認知工具分數正常。下列何者正確？',opts:['不能只因分數正常就排除失智','分數正常即可排除失智','應改用更短的工具再測一次','只有分數異常才需要知情者病史'],ans:0,why:'NICE 明確建議不要只因認知工具分數正常就排除失智。',src:'NICE NG97 1.2.4'},
 {level:'basic',topic:'病史',stem:'初次評估疑似失智時，病史最好來自：',opts:['僅當事人本人，以尊重自主','僅家屬，因本人病識感常不足','當事人，並在可能時加上熟悉他的人','只需既往病歷與用藥紀錄'],ans:2,why:'NICE 要求向當事人取得病史，並在可能時向熟悉當事人的人（如家屬）取得。',src:'NICE NG97 1.2.1'},
 {level:'basic',topic:'快速進展',stem:'疑似快速進展型失智，應優先：',opts:['三個月後重做認知篩檢','轉介可做腦脊髓液等檢查的神經科','先試用乙醯膽鹼酯酶抑制劑','安排一般記憶門診，依例行順序候診'],ans:1,why:'應轉介至可做腦脊髓液等檢查的神經科，評估 CJD 及類似疾病。',src:'NICE NG97 1.2.7'},
 {level:'basic',topic:'DLB',stem:'下列何者不是 2017 DLB 共識的核心臨床特徵？',opts:['反覆成形視幻覺','認知波動','REM 睡眠行為障礙','嚴重抗精神病藥敏感'],ans:3,why:'核心特徵是波動、視幻覺、REM 睡眠行為障礙與巴金森症狀。嚴重抗精神病藥敏感屬支持性特徵。',src:'McKeith 2017'},
 {level:'basic',topic:'bvFTD',stem:'依 FTDC 2011，possible bvFTD 除進行性退化外，六項行為／認知特徵至少需要幾項？',opts:['一項','兩項','三項','六項全部'],ans:2,why:'需要六項中至少三項，且症狀須持續或反覆，不是單次或罕見事件。',src:'Rascovsky 2011'},
 {level:'basic',topic:'檢查選擇',stem:'下列哪一項不應用來診斷阿茲海默症？',opts:['言語情節記憶測試','APOE 基因型','結構性腦影像','腦脊髓液 tau 與 amyloid'],ans:1,why:'NICE 明確建議不要用 APOE 基因型或腦波來診斷 AD。',src:'NICE NG97 1.2.18'},
 {level:'basic',topic:'危險因子',stem:'關於 Lancet 2024 的危險因子，下列何者正確？',opts:['約 45% 是人口可歸因比例，不是個人風險','勾選項目越多，個人失智機率可依比例推算','處理全部因子可保證個人降低 45% 風險','2024 新增的兩項是睡眠與飲食'],ans:0,why:'約 45% 是人口層級的可歸因比例，不能換算成個人機率。2024 新增的是高 LDL 膽固醇與未治療視力損失。',src:'Lancet 失智症委員會 2024'},
 {level:'adv',topic:'DLB 分類',stem:'已成立失智症，唯一的核心特徵是疑似演夢行為；多頻道睡眠檢查證實 REM 睡眠無肌張力消失。依 2017 共識較符合：',opts:['Possible DLB','尚無法列入 DLB','Probable DLB','Definite DLB'],ans:2,why:'PSG 證實 REM 睡眠無肌張力消失是指標性生物標記。失智加一項核心特徵與一項指標性生物標記，可診斷 probable DLB。',src:'McKeith 2017'},
 {level:'adv',topic:'DLB 分類',stem:'已成立失智症，沒有任何核心臨床特徵，但 DAT 影像顯示基底核攝取降低。依 2017 共識：',opts:['可列 possible DLB','指標性生物標記異常即為 probable DLB','必須另有兩項核心特徵才能列任何 DLB 分類','應直接改診斷為巴金森病失智'],ans:0,why:'有指標性生物標記但無核心特徵，可列 possible DLB；共識明言 probable DLB 不應只憑生物標記診斷。',src:'McKeith 2017'},
 {level:'adv',topic:'DLB／PDD',stem:'巴金森病確診五年、動作症狀穩定，近一年出現多認知領域下降並影響生活，也有視幻覺。工具與一年慣例較支持：',opts:['DLB，因為視幻覺是 DLB 的核心特徵','PDD，失智在確立的 PD 之後','AD，因為多認知領域下降','無法區分，應暫停所有評估'],ans:1,why:'認知症狀在 PD 確診超過一年後才出現，依一年慣例較符合 PDD。一年是鑑別慣例，並非完整診斷準則。',src:'McKeith 2017；本工具規則'},
 {level:'adv',topic:'bvFTD 排除',stem:'符合三項行為特徵，有明顯功能下降及額葉萎縮，但生物標記強烈指向 AD。依 FTDC 2011 最多可列：',opts:['Probable bvFTD，因影像相符','Definite bvFTD','Possible bvFTD','任何 bvFTD 都不可列'],ans:2,why:'排除條件 A、B 對所有 bvFTD 都須為否；條件 C（生物標記強烈指向 AD 等）可在 possible 為陽性，但 probable 必須為陰性。',src:'Rascovsky 2011'},
 {level:'adv',topic:'PPA',stem:'以語言困難起病，自發言語中找詞困難且句子複述明顯受損，單字理解與文法相對保留。最符合哪一型？最常見的病理為何？',opts:['語意型；TDP-43','非流暢型；tau','Logopenic 型；FTLD','Logopenic 型；AD'],ans:3,why:'找詞與句子複述障礙是 logopenic 型的核心特徵，其最常見病理可能是 AD；但變異型與病理沒有一對一對應。',src:'Gorno-Tempini 2011；NICE NG97 1.5.15'},
 {level:'adv',topic:'血管性',stem:'沒有中風或 TIA 病史。依 VASCOG 2014，下列哪個組合支持血管性認知障礙的臨床條件？',opts:['速度、注意力或執行功能下降，加早期步態或排尿問題','情節記憶明顯受損為主，加上內側顳葉與海馬迴萎縮','單純有高血壓與糖尿病病史，認知下降原因未明','MRI 少量白質變化，認知測驗正常，功能也無影響'],ans:0,why:'無中風史時，需以處理速度、複雜注意力和／或額葉執行功能下降為主，並加上早期步態障礙、早期排尿症狀或人格情緒改變之一。',src:'Sachdev 2014'},

 function workupPanel(){return `<section class="panel"><h3>可逆／共存因素檢查 · 專業評估</h3><p class="hint">NICE NG97 建議以適當血液、尿液檢查與結構性影像排除可逆原因；項目由醫師依情境選擇，非固定套組。「正常」不代表已排除所有可治療病因。</p>${DG.workup.map(w=>`<div class="row"><fieldset aria-label="${escape(w.name)}" aria-describedby="wk-${w.id}"><div class="question"><legend>${escape(w.name)}${w.core?'':'<span class="clinical-label"> · 視情境</span>'}</legend><p id="wk-${w.id}">${escape(w.note)}</p></div>${seg(w.id,state.workup[w.id],'workup')}</fieldset></div>`).join('')}</section>`;}
 function risks(){const r=DG.evaluate(state);return heading('14項危險因子','以 Lancet 2024 生命歷程模型，建立可追蹤的改善計畫。')+`<div class="alert info">約 45% 是人口層級的可歸因比例，不能換算成個人失智機率。這份清單不作診斷或風險分級。</div><p class="metricline">已確認 ${r.riskKnown}／14 項狀態 · ${r.riskPositive.length} 項回報存在</p><p class="hint">生命階段是報告分類，不限制介入年齡。既往教育與腦外傷不能回溯改變；改善計畫著重可採取的後續行動。沒有資料時保留「不清楚」。</p>${['早年','中年','晚年'].map(stage=>`<section class="panel"><h3>${stage}</h3>${DG.risks.filter(x=>x.stage===stage).map(risk=>{const v=state.risks[risk.id]||{};return `<div class="risk-item"><div class="risk-header"><div class="risk-title">${risk.name}${risk.badge?`<span class="badge">${risk.badge}</span>`:''}</div>${seg(risk.id,v.status,'risk')}</div><p>${risk.action}</p><div class="risk-fields">${riskSelect(risk.id,'plan','證據、日期與改善計畫（選填）',v.plan,planOptions)}${riskSelect(risk.id,'owner','負責人／角色（選填）',v.owner,ownerOptions)}<label class="field">追蹤日期（選填）<input data-risk="${risk.id}" data-prop="date" type="date" value="${escape(v.date)}"></label></div></div>`}).join('')}</section>`).join('')}`+next('report','產生評估報告');}
 const list=arr=>arr.length?`<ul>${arr.map(x=>`<li>${escape(x)}</li>`).join('')}</ul>`:'<p class="hint">尚無紀錄。</p>';
 const sourceLink=i=>`<a href="${DG.sources[i][1]}" target="_blank" rel="noopener noreferrer">${DG.sources[i][0]}</a>`;
 function report(){const r=DG.evaluate(state);return heading('評估報告','提供可追溯的就醫與團隊討論摘要。')+`<p class="print-only"><strong>認知照護導航 · 臨床決策輔助，不能取代醫師判斷</strong></p><p class="hint">產生日期：${new Date().toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei'})} · ${state.mode==='clinical'?'醫療人員':'民眾與家屬'}模式 · 版本 ${VERSION}</p><div class="toolbar no-print"><button class="primary" data-action="print">列印／存成 PDF</button><button class="secondary" data-action="export">下載評估資料</button><button class="secondary" data-action="import">匯入評估資料</button><button class="secondary" data-action="reset">清除本次資料</button><input type="file" id="import-file" accept="application/json,.json" hidden></div>${safetyAlert(r)}<section class="panel"><h3>認知與功能摘要</h3><p>${escape(r.syndrome)}</p>${r.gate!=='ready'?'<p class="hint">此摘要僅反映輸入資訊；目前應優先完成安全評估。</p>':''}${state.meta.age?`<p>年齡：${escape(state.meta.age)}</p>`:''}${state.meta.onset?`<p>變化時間：${escape(state.meta.onset)}</p>`:''}${state.meta.observer?`<p>資訊來源：${escape(state.meta.observer)}</p>`:''}${state.meta.notes?`<p>補充摘要：${escape(state.meta.notes)}</p>`:''}<h4>認知與功能填答紀錄</h4>${list(DG.sections.cognition.filter(q=>!q.clinical||state.mode==='clinical').map(q=>q.label+'：'+(state.answers[q.id]==='yes'?'有':state.answers[q.id]==='no'?'無':'不清楚')))}<h4>待補證據</h4>${list(r.cognitionMissing)}<h4>其他影響因素</h4>${r.confounders.length?list(r.confounders):'<p class="hint">尚未回報明確線索；不代表已完成排除。</p>'}${state.mode==='clinical'?`<h4>可逆／共存因素檢查</h4>${r.workupAbnormal.length?`<p><strong>異常：</strong>${escape(r.workupAbnormal.join('、'))}——請先處理並評估其對認知的影響。</p>`:''}${r.workupPending.length?`<p><strong>核心項目未做／未知：</strong>${escape(r.workupPending.join('、'))}</p>`:'<p class="hint">核心項目均已記錄結果。</p>'}<p class="hint">${sourceLink(1)}；${sourceLink(10)}</p>`:''}<p class="hint">${sourceLink(0)}；${sourceLink(1)}</p></section>${r.gate==='ready'?`<section class="panel"><h3>鑑別方向 · 不依機率排序</h3><p class="hint">「未回報線索」不代表排除疾病；以下是部分準則摘要，不是完整診斷分類。所有亞型仍需臨床確認。</p>${r.mixed?'<div class="alert info">同時回報血管及其他退化性線索：請保留混合病因，不能由網站確認混合型失智。</div>':''}${r.candidates.map(c=>`<article class="result${c.active?'':' inactive'}"><div class="result-head"><h3>${c.name}</h3><span class="status ${c.active?'on':''}">${c.active?'有線索，需確認':'未回報特異線索'}</span></div><div class="evidence"><div><h4>支持線索（使用者回報）</h4>${list(c.support)}</div><div><h4>待補證據</h4>${list(c.missing)}</div></div>${c.absent.length?`<details><summary>已回報「無」的相關項目</summary>${list(c.absent)}<p class="hint">這些回答不單獨構成排除診斷。</p></details>`:''}<p class="result-note">${escape(c.note)}</p><p><strong>下一步：</strong>${escape(c.next)}</p><p class="hint">依據：${sourceLink(c.source)}</p></article>`).join('')}</section>`:'<section class="panel"><h3>失智症亞型判讀暫停</h3><p>先處理警訊或補齊安全問題。危險因子改善清單仍可整理。</p><button class="secondary no-print" data-nav="safety">返回安全檢核</button></section>'}<section class="panel"><h3>危險因子改善與追蹤清單</h3><p>已確認 ${r.riskKnown}/14 項狀態；${r.riskPositive.length} 項回報存在。此數量不是風險分數。</p><div class="table-wrap"><table><thead><tr><th>因子／狀態</th><th>下一步與計畫狀態</th><th>負責人</th><th>追蹤日期</th></tr></thead><tbody>${DG.risks.map(x=>{const v=state.risks[x.id]||{};return `<tr><td>${x.name}<br>${v.status==='yes'?'回報存在':v.status==='no'?'回報無':'待確認'}</td><td>${v.status==='yes'?escape(x.action):v.status==='no'?'持續維持並依需要再評估。':'補充病史／資料以確認。'}${v.plan?`<br><strong>計畫狀態：</strong>${escape(v.plan)}`:''}</td><td>${escape(v.owner)||'未指定'}</td><td>${escape(v.date)||'未安排'}</td></tr>`}).join('')}</tbody></table></div><p class="hint">${sourceLink(8)}</p></section><div class="alert">沒有正式認知測驗、神經學檢查及完整鑑別時，不能確診失智或排除可治療病因。本工具尚未經臨床效能驗證。</div>`;}
 function sources(){return heading('準則與限制','每個結果都有來源；網站規則不等同正式量表或完整準則。')+`<section class="panel"><h3>使用界線</h3><ul><li>原創中文病史整理問句，未重製 MoCA、MMSE、AD8 或其他正式量表；不宣稱有診斷敏感度或特異度。</li><li>本版本涵蓋常見鑑別方向，並非所有失智症病因，也不提供自動診斷、藥物選擇或療效預測。</li><li>正常認知篩檢、正常 CT／MRI 或沒有典型記憶症狀，均不能單獨排除失智／AD。</li><li>DLB、bvFTD 等只做部分特徵核對；完整門檻、排除條件、病理與混合病因須由專科評估。</li><li>視聽、教育、語言、文化及精神症狀會影響認知測試解讀。</li><li>AD 的生物學診斷與臨床症候群分開。2025 血液生物標記指引適用於專科、有客觀認知障礙者；triage 檢測至少需 90% 敏感度／75% 特異度，取代 PET／CSF 的檢測至少需兩者 90%。不是所有血液測試均符合；需考量腎功能等共病與特定檢測的效能。</li><li>Lancet 的生命階段與人口可歸因比例不是個人預測模型，不能由勾選數目推算機率。</li></ul></section><section class="panel"><h3>原始指引與共識</h3><ol class="sources-list">${DG.sources.map(([name,url,desc])=>`<li><a href="${url}" target="_blank" rel="noopener noreferrer">${name}</a><p>${desc}</p></li>`).join('')}</ol><p class="hint">來源查核日期：2026-10-11；示範病例、考題與心智圖 2026-11-01。年份為原始發布版本；較早年份不代表已被新準則取代，公開臨床使用前仍需專科內容審查與定期更新。</p></section><section class="panel"><h3>隱私與資料操作</h3><p>資料僅留在目前頁面的記憶體；重新整理或關閉頁面即清除。沒有登入、伺服器、分析追蹤或自動儲存。匯出與列印是您主動選擇的動作，檔案可能包含敏感資訊，請使用醫院核准的儲存方式。</p><p>網站不收集姓名、病歷號。自由文字仍可能包含個資；請自行去識別化。外部來源連結會另開網站。</p></section>`;}
 const caseState=c=>{const answers={};(c.yes||[]).forEach(k=>answers[k]='yes');(c.no||[]).forEach(k=>answers[k]='no');const risks={};Object.entries(c.risks||{}).forEach(([k,v])=>risks[k]={status:v});return {mode:'clinical',answers,risks,meta:{notes:'示範病例（虛構）：'+c.title},workup:{...(c.workup||{})}};};
 const gateText={urgent:'優先處理急性醫療問題，暫停亞型判讀',rapid:'需加速專科評估，暫停亞型判讀',incomplete:'安全檢核未完成',ready:'安全檢核通過，可整理鑑別方向'};
 function caseResult(c){const r=DG.evaluate(caseState(c));const on=r.candidates.filter(x=>x.active);return `<dl class="case-result"><dt>安全檢核</dt><dd>${gateText[r.gate]}</dd><dt>症候群摘要</dt><dd>${escape(r.syndrome)}</dd>${r.gate==='ready'?`<dt>有線索的方向</dt><dd>${on.length?on.map(x=>escape(x.name)).join('、'):'目前沒有特異線索'}${r.mixed?'（提示混合病因）':''}</dd>`:''}${r.confounders.length?`<dt>其他影響因素</dt><dd>${r.confounders.map(escape).join('；')}</dd>`:''}</dl>`;}
 function cases(){return heading('示範病例','八個虛構病例，先自己想，再對照工具判讀與教學重點。')+`<div class="alert info">病例皆為教學用虛構情境。「工具判讀」由本網站規則即時計算，不是診斷；載入後會以醫療人員模式開啟報告，並取代目前頁面的資料。</div>${DG.cases.map((c,i)=>`<article class="panel case"><div class="result-head"><h3>病例 ${i+1}｜${escape(c.title)}</h3><span class="status">${escape(c.tag)}</span></div><p>${escape(c.story)}</p><p class="case-think"><strong>想一想：</strong>${escape(c.think)}</p><details><summary>看工具判讀與教學重點</summary><h4>工具判讀</h4>${caseResult(c)}<h4>教學重點</h4><ul>${c.points.map(p=>`<li>${escape(p)}</li>`).join('')}</ul><p class="hint">依據：${sourceLink(c.source)}</p></details><div class="toolbar no-print"><button class="secondary" data-case="${c.id}">載入評估工具，看完整報告</button></div></article>`).join('')}`;}
 function loadCase(id){const c=DG.cases.find(x=>x.id===id);if(!c)return;if(hasData()&&!window.confirm('載入示範病例會取代目前頁面的評估資料，是否繼續？'))return;state=caseState(c);saved=JSON.stringify(state);navigate('report');notice('已載入示範病例（虛構資料）。');}
 const shuffled=n=>{const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
 const levelName={basic:'基礎',adv:'高階'};let Q=null;
 function startQuiz(set){const items=DG.quiz.filter(x=>set==='all'||x.level===set);Q={set,items,order:items.map(x=>shuffled(x.opts.length)),a:items.map(()=>null),done:false};}
 function quizQuestion(x,i){const opts=Q.order[i].map((o,k)=>{const cls=!Q.done?'':o===x.ans?' right':o===Q.a[i]?' wrong':'';return `<label class="qz-opt${cls}"><input type="radio" name="qz${i}" data-q="${i}" value="${o}"${Q.a[i]===o?' checked':''}${Q.done?' disabled':''}><b>${'ABCD'[k]}.</b><span>${escape(x.opts[o])}${Q.done&&o===x.ans?'（正確答案）':''}${Q.done&&o===Q.a[i]&&o!==x.ans?'（你的答案）':''}</span></label>`;}).join('');const ok=Q.a[i]===x.ans;return `<fieldset class="panel qz-q" id="qz-q${i}"><legend><span class="badge qz-${x.level}">${levelName[x.level]}</span>第 ${i+1} 題｜${escape(x.topic)}</legend><p class="qz-stem">${escape(x.stem)}</p>${opts}${Q.done?`<div class="alert ${ok?'info':''} qz-why"><strong>${ok?'答對。':'答錯。'}</strong>${escape(x.why)}<br><small>出處：${escape(x.src)}</small></div>`:''}</fieldset>`;}
 function quizScore(){const right=i=>Q.a[i]===Q.items[i].ans;const idx=Q.items.map((_,i)=>i);const by=['basic','adv'].filter(l=>Q.items.some(x=>x.level===l)).map(l=>{const ids=idx.filter(i=>Q.items[i].level===l);return `${levelName[l]} ${ids.filter(right).length}/${ids.length}`;}).join('　');return `<div class="panel qz-score" id="qz-result" tabindex="-1"><strong>測驗結果</strong><div class="qz-num">${idx.filter(right).length} / ${Q.items.length}</div><div>${by}</div></div>`;}
 function quiz(){if(!Q)startQuiz('all');return heading('考題','基礎 10 題、高階 10 題，交卷後顯示解析與出處。')+`<p class="hint">依本頁採用的指引與共識命題，供教學自評，不是資格認證。作答不會儲存；每次開始時選項順序隨機。</p><div class="toolbar qz-sets no-print" role="group" aria-label="題組">${[['all','全部 20 題'],['basic','基礎 10 題'],['adv','高階 10 題']].map(([k,t])=>`<button class="${Q.set===k?'primary':'secondary'}" data-qset="${k}" aria-pressed="${Q.set===k}">${t}</button>`).join('')}</div>${Q.done?quizScore():''}${Q.items.map(quizQuestion).join('')}<div class="bottom-actions no-print">${Q.done?'<button class="primary" data-qact="again">重新作答</button>':`<span class="progress" id="qz-progress" aria-live="polite">已答 ${Q.a.filter(x=>x!==null).length} / ${Q.items.length}</span><button class="primary" data-qact="submit">交卷</button>`}</div>`;}
 function quizAct(act){const y=()=>window.scrollTo({top:0,behavior:'instant'});if(act==='again'){startQuiz(Q.set);render();y();return;}const miss=Q.a.indexOf(null);if(miss>=0){const n=Q.a.filter(x=>x===null).length;document.getElementById('qz-progress').textContent=`尚有 ${n} 題未作答（第 ${miss+1} 題起）`;const el=document.getElementById('qz-q'+miss);el.scrollIntoView({block:'center',behavior:'instant'});el.querySelector('input').focus({preventScroll:true});return;}Q.done=true;render();y();document.getElementById('qz-result').focus({preventScroll:true});}
 const mapOpen=new Set();
 const mapBranch=(b,side,i)=>{const id=`mm-${side}${i}`,open=mapOpen.has(id);return `<div class="mm-branch ${side}"><button type="button" class="mm-head" data-mm="${id}" aria-expanded="${open}" aria-controls="${id}"><span class="mm-t">${i+1}. ${escape(b.t)}</span><span class="mm-s">${escape(b.s)}</span></button><ul class="mm-leaves" id="${id}"${open?'':' hidden'}>${b.l.map(([k,x])=>`<li><b>${escape(k)}</b>　${escape(x)}</li>`).join('')}</ul></div>`;};
 function mindmap(){return heading('心智圖','分成評估流程與病因鑑別兩部分，點分支展開細節。')+`<p class="hint">內容與評估工具使用相同來源，是部分準則摘要，不等於完整診斷準則。NICE 條號指 NG97；其餘準則見「準則與限制」。</p><div class="toolbar no-print"><button class="secondary" data-mmall="open">全部展開</button><button class="secondary" data-mmall="close">全部收合</button></div><div class="mm" id="mm-wrap"><svg id="mm-links" aria-hidden="true"></svg><div class="mm-side"><h3 class="mm-col left">評估流程</h3>${DG.map.left.map((b,i)=>mapBranch(b,'left',i)).join('')}</div><div class="mm-center" id="mm-center">疑似<br>認知下降<small>先安全、再症候群、後病因</small></div><div class="mm-side"><h3 class="mm-col right">病因鑑別</h3>${DG.map.right.map((b,i)=>mapBranch(b,'right',i)).join('')}</div></div>`;}
 function drawMapLinks(){const w=document.getElementById('mm-wrap'),svg=document.getElementById('mm-links'),c=document.getElementById('mm-center');if(!w||getComputedStyle(svg).display==='none')return;const W=w.getBoundingClientRect(),C=c.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${W.width} ${W.height}`);svg.innerHTML=[...w.querySelectorAll('.mm-branch')].map(b=>{const left=b.classList.contains('left'),r=b.querySelector('.mm-head').getBoundingClientRect();const x1=(left?C.left:C.right)-W.left,y1=C.top+C.height/2-W.top,x2=(left?r.right:r.left)-W.left,y2=r.top+r.height/2-W.top,mx=(x1+x2)/2;return `<path class="${left?'left':'right'}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`;}).join('');}
 function setBranch(btn,open){const id=btn.dataset.mm;open?mapOpen.add(id):mapOpen.delete(id);btn.setAttribute('aria-expanded',open);document.getElementById(id).hidden=!open;}
 const renderers={safety,cognition,differential,risks,report,cases,map:mindmap,quiz,sources};
 function progress(id){const qs=DG.sections[id]?.filter(q=>!q.clinical||state.mode==='clinical');if(qs)return [qs.filter(q=>['yes','no'].includes(state.answers[q.id])).length,qs.length];if(id==='risks')return [DG.risks.filter(x=>['yes','no'].includes(state.risks[x.id]?.status)).length,14];return null;}
 function render(){document.getElementById('navigation').innerHTML=pages.map(([id,t,i])=>{const pr=progress(id);return `<button data-nav="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(i)}<span>${t}</span>${pr?`<span class="count" aria-label="已回答 ${pr[0]}／${pr[1]}">${pr[0]}/${pr[1]}</span>`:''}</button>`;}).join('');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));main.innerHTML=renderers[page]();drawMapLinks();}
 function navigate(p){if(!renderers[p])return;page=p;render();main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
 function notice(message){document.getElementById('notice').textContent=message;}
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.action==='start-evaluation'){const section=document.getElementById('safety-check');section?.scrollIntoView({block:'start',behavior:'instant'});section?.focus({preventScroll:true});return;}
  if(b.dataset.nav){navigate(b.dataset.nav);return;}
  if(b.dataset.case){loadCase(b.dataset.case);return;}
  if(b.dataset.qset){startQuiz(b.dataset.qset);render();return;}
  if(b.dataset.qact){quizAct(b.dataset.qact);return;}
  if(b.dataset.mm){setBranch(b,b.getAttribute('aria-expanded')!=='true');drawMapLinks();return;}
  if(b.dataset.mmall){main.querySelectorAll('.mm-head').forEach(h=>setBranch(h,b.dataset.mmall==='open'));drawMapLinks();return;}
  if(b.dataset.mode){state.mode=b.dataset.mode;render();notice('已切換模式。民眾模式不使用專業評估欄位。');return;}
  if(b.dataset.kind){const {key,value,kind}=b.dataset;if(kind==='answer')state.answers[key]=value;else if(kind==='workup')state.workup[key]=value;else state.risks[key]={...state.risks[key],status:value};const y=window.scrollY;render();window.scrollTo(0,y);main.querySelector(`[data-kind="${kind}"][data-key="${key}"][data-value="${value}"]`)?.focus({preventScroll:true});return;}
  if(b.dataset.action==='print'){window.print();return;}
  if(b.dataset.action==='export'){const blob=new Blob([JSON.stringify({schema:'dementia-guide-v1',version:VERSION,...state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`認知照護評估-${new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'})}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);saved=JSON.stringify(state);notice('已下載。請保管評估檔案並避免放在公用電腦。');return;}
  if(b.dataset.action==='import'){document.getElementById('import-file').click();return;}
  if(b.dataset.action==='reset'&&window.confirm('清除目前頁面所有評估與追蹤資料？已下載的檔案不會被刪除。')){state=blank(state.mode);navigate('safety');notice('本次資料已清除。');}
 });
 document.addEventListener('input',e=>{const el=e.target;if(el.dataset.meta){const v=el.value;if(el.dataset.meta==='age'){const ok=v===''||(/^\d{1,3}$/.test(v)&&Number(v)<=120);el.setCustomValidity(ok?'':'請輸入 0 至 120 的整數歲數。');if(!ok){delete state.meta.age;el.reportValidity();return;}}state.meta[el.dataset.meta]=v;}if(el.dataset.risk)state.risks[el.dataset.risk]={...state.risks[el.dataset.risk],[el.dataset.prop]:el.value};});
 function validateImport(d){if(!d||d.schema!=='dementia-guide-v1'||!['public','clinical'].includes(d.mode))throw Error('檔案格式或版本不相符。');const out=blank(d.mode);const isRecord=v=>v&&typeof v==='object'&&!Array.isArray(v);if(!isRecord(d.answers)||!isRecord(d.risks)||!isRecord(d.meta)||(d.workup!==undefined&&!isRecord(d.workup)))throw Error('評估資料結構不正確。');for(const w of DG.workup){const v=d.workup?.[w.id];if(v===undefined)continue;if(!['pending','normal','abnormal'].includes(v))throw Error('檢查結果不正確。');out.workup[w.id]=v;}for(const q of Object.values(DG.sections).flat()){const v=d.answers[q.id];if(v!==undefined){if(!['yes','no','unknown'].includes(v))throw Error('問句回答不正確。');out.answers[q.id]=v;}}
  for(const r of DG.risks){const v=d.risks[r.id];if(v===undefined)continue;if(!isRecord(v))throw Error('危險因子資料不正確。');const n={};if(v.status!==undefined){if(!['yes','no','unknown'].includes(v.status))throw Error('危險因子狀態不正確。');n.status=v.status;}for(const p of ['plan','owner','date'])if(v[p]!==undefined){if(typeof v[p]!=='string'||v[p].length>(p==='plan'?800:100))throw Error('文字資料超出限制。');if(p==='date'&&v[p]&&!/^\d{4}-\d{2}-\d{2}$/.test(v[p]))throw Error('日期格式不正確。');n[p]=v[p];}out.risks[r.id]=n;}
  for(const k of ['age','onset','observer','notes'])if(d.meta[k]!==undefined){const v=d.meta[k];if(typeof v!=='string'||v.length>2000)throw Error('摘要格式不正確。');if(k==='age'&&v&&(!/^\d+$/.test(v)||Number(v)>120))throw Error('年齡不正確。');out.meta[k]=v;}return out;
 }
 document.addEventListener('change',async e=>{if(e.target.dataset.q!==undefined){Q.a[Number(e.target.dataset.q)]=Number(e.target.value);const el=document.getElementById('qz-progress');if(el)el.textContent=`已答 ${Q.a.filter(x=>x!==null).length} / ${Q.items.length}`;return;}if(e.target.id!=='import-file')return;const file=e.target.files[0];if(!file)return;try{if(file.size>200000)throw Error('檔案過大（上限 200 KB）。');const imported=validateImport(JSON.parse(await file.text()));if(!window.confirm('匯入將取代目前頁面的評估資料，是否繼續？'))return;state=imported;render();notice('已匯入評估資料；仍需核對紀錄來源。');}catch(err){notice('匯入失敗：'+err.message);}finally{e.target.value='';}});
 const hasData=()=>[state.answers,state.risks,state.meta,state.workup].some(o=>Object.values(o).some(v=>v&&(typeof v!=='object'||Object.values(v).some(Boolean))));
 let saved=JSON.stringify(state);
 window.addEventListener('beforeunload',e=>{if(hasData()&&JSON.stringify(state)!==saved){e.preventDefault();e.returnValue='';}});
 window.addEventListener('resize',drawMapLinks);
 render();
})();
</script></body></html>
