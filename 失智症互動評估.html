 function cognition(){return heading('認知與功能','與過去的自己比較，並確認生活獨立性。')+`<div class="alert info">本問卷用來整理病史，沒有診斷分數。請邀請熟悉當事人的家屬補充資訊；「無」應表示已確認沒有此變化。</div><div class="form-grid">${field('age','年齡（選填）','number')}${selectField('onset','首次發現變化的時間（選填）',['數小時至數天內','數週內','約 1–3 個月前','約 3–6 個月前','約 6–12 個月前','約 1–2 年前','超過 2 年前','不清楚'])}${selectField('observer','資訊來源（選填）',['本人','家屬／照顧者','本人與家屬／照顧者','醫療人員','醫療紀錄','多方資訊','不清楚'])}</div><section class="panel">${questions(DG.sections.cognition)}</section><label class="field">功能變化或正式測試摘要（選填；請勿輸入姓名、病歷號）<textarea data-meta="notes" maxlength="2000">${escape(state.meta.notes)}</textarea></label>${state.mode==='public'?'<p class="hint">醫療人員模式可補入正式認知評估及其他原因評估結果。</p>':''}`+next('differential','下一步：鑑別線索');}
 function differential(){return heading('鑑別線索','保留多種可能病因，逐項整理支持線索與證據缺口。')+safetyAlert(DG.evaluate(state))+`<div class="alert info">症狀特徵彼此可能重疊；以下問句不等同完整診斷準則。生物標記與影像需由專科解讀。</div><section class="panel">${questions(DG.sections.differential)}</section>${state.mode==='clinical'?workupPanel():''}`+next('risks','下一步：14項危險因子');}
 function workupPanel(){return `<section class="panel"><h3>可逆／共存因素檢查 · 專業評估</h3><p class="hint">NICE NG97 建議以適當血液、尿液檢查與結構性影像排除可逆原因；項目由醫師依情境選擇，非固定套組。「正常」不代表已排除所有可治療病因。</p>${DG.workup.map(w=>`<div class="row"><fieldset aria-label="${escape(w.name)}" aria-describedby="wk-${w.id}"><div class="question"><legend>${escape(w.name)}${w.core?'':'<span class="clinical-label"> · 視情境</span>'}</legend><p id="wk-${w.id}">${escape(w.note)}</p></div>${seg(w.id,state.workup[w.id],'workup')}</fieldset></div>`).join('')}</section>`;}
 function risks(){const r=DG.evaluate(state);return heading('14項危險因子','以 Lancet 2024 生命歷程模型，建立可追蹤的改善計畫。')+`<div class="alert info">約 45% 是人口層級的可歸因比例，不能換算成個人失智機率，也不能把各因子的比例直接相加。這份清單不作診斷或風險分級。</div><p class="metricline">已確認 ${r.riskKnown}／14 項狀態 · ${r.riskPositive.length} 項回報存在</p><p class="hint">生命階段是報告分類，不限制介入年齡。既往教育與腦外傷不能回溯改變；改善計畫著重可採取的後續行動。沒有資料時保留「不清楚」。</p>${['早年','中年','晚年'].map(stage=>`<section class="panel"><h3>${stage}</h3>${DG.risks.filter(x=>x.stage===stage).map(risk=>{const v=state.risks[risk.id]||{};return `<div class="risk-item"><div class="risk-header"><div class="risk-title">${risk.name}${risk.badge?`<span class="badge">${risk.badge}</span>`:''}</div>${seg(risk.id,v.status,'risk')}</div><p>${risk.action}</p><div class="risk-fields">${riskSelect(risk.id,'plan','證據、日期與改善計畫（選填）',v.plan,planOptions)}${riskSelect(risk.id,'owner','負責人／角色（選填）',v.owner,ownerOptions)}<label class="field">追蹤日期（選填）<input data-risk="${risk.id}" data-prop="date" type="date" value="${escape(v.date)}"></label></div></div>`}).join('')}</section>`).join('')}`+next('report','產生評估報告');}
 const list=arr=>arr.length?`<ul>${arr.map(x=>`<li>${escape(x)}</li>`).join('')}</ul>`:'<p class="hint">尚無紀錄。</p>';
 const sourceLink=i=>`<a href="${DG.sources[i][1]}" target="_blank" rel="noopener noreferrer">${DG.sources[i][0]}</a>`;
 function report(){const r=DG.evaluate(state);return heading('評估報告','提供可追溯的就醫與團隊討論摘要。')+`<p class="print-only"><strong>認知照護導航 · 臨床決策輔助，不能取代醫師判斷</strong></p><p class="hint">產生日期：${new Date().toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei'})} · ${state.mode==='clinical'?'醫療人員':'民眾與家屬'}模式 · 版本 ${VERSION}</p><div class="toolbar no-print"><button class="primary" data-action="print">列印／存成 PDF</button><button class="secondary" data-action="export">下載評估資料</button><button class="secondary" data-action="import">匯入評估資料</button><button class="secondary" data-action="reset">清除本次資料</button><input type="file" id="import-file" accept="application/json,.json" hidden></div>${safetyAlert(r)}<section class="panel"><h3>認知與功能摘要</h3><p>${escape(r.syndrome)}</p>${r.gate!=='ready'?'<p class="hint">此摘要僅反映輸入資訊；目前應優先完成安全評估。</p>':''}${state.meta.age?`<p>年齡：${escape(state.meta.age)}</p>`:''}${state.meta.onset?`<p>變化時間：${escape(state.meta.onset)}</p>`:''}${state.meta.observer?`<p>資訊來源：${escape(state.meta.observer)}</p>`:''}${state.meta.notes?`<p>補充摘要：${escape(state.meta.notes)}</p>`:''}<h4>認知與功能填答紀錄</h4>${list(DG.sections.cognition.filter(q=>!q.clinical||state.mode==='clinical').map(q=>q.label+'：'+(state.answers[q.id]==='yes'?'有':state.answers[q.id]==='no'?'無':'不清楚')))}<h4>待補證據</h4>${list(r.cognitionMissing)}<h4>其他影響因素</h4>${r.confounders.length?list(r.confounders):'<p class="hint">尚未回報明確線索；不代表已完成排除。</p>'}${state.mode==='clinical'?`<h4>可逆／共存因素檢查</h4>${r.workupAbnormal.length?`<p><strong>異常：</strong>${escape(r.workupAbnormal.join('、'))}——請先處理並評估其對認知的影響。</p>`:''}${r.workupPending.length?`<p><strong>核心項目未做／未知：</strong>${escape(r.workupPending.join('、'))}</p>`:'<p class="hint">核心項目均已記錄結果。</p>'}<p class="hint">${sourceLink(1)}；${sourceLink(10)}</p>`:''}<p class="hint">${sourceLink(0)}；${sourceLink(1)}</p></section>${r.gate==='ready'?`<section class="panel"><h3>鑑別方向 · 不依機率排序</h3><p class="hint">「未回報線索」不代表排除疾病；以下是部分準則摘要，不是完整診斷分類。所有亞型仍需臨床確認。</p>${r.mixed?'<div class="alert info">同時回報血管及其他退化性線索：請保留混合病因，不能由網站確認混合型失智。</div>':''}${r.candidates.map(c=>`<article class="result${c.active?'':' inactive'}"><div class="result-head"><h3>${c.name}</h3><span class="status ${c.active?'on':''}">${c.active?'有線索，需確認':'未回報特異線索'}</span></div><div class="evidence"><div><h4>支持線索（使用者回報）</h4>${list(c.support)}</div><div><h4>待補證據</h4>${list(c.missing)}</div></div>${c.absent.length?`<details><summary>已回報「無」的相關項目</summary>${list(c.absent)}<p class="hint">這些回答不單獨構成排除診斷。</p></details>`:''}<p class="result-note">${escape(c.note)}</p><p><strong>下一步：</strong>${escape(c.next)}</p><p class="hint">依據：${sourceLink(c.source)}</p></article>`).join('')}</section>`:'<section class="panel"><h3>失智症亞型判讀暫停</h3><p>先處理警訊或補齊安全問題。危險因子改善清單仍可整理。</p><button class="secondary no-print" data-nav="safety">返回安全檢核</button></section>'}<section class="panel"><h3>危險因子改善與追蹤清單</h3><p>已確認 ${r.riskKnown}/14 項狀態；${r.riskPositive.length} 項回報存在。此數量不是風險分數。</p><div class="table-wrap"><table><thead><tr><th>因子／狀態</th><th>下一步與計畫狀態</th><th>負責人</th><th>追蹤日期</th></tr></thead><tbody>${DG.risks.map(x=>{const v=state.risks[x.id]||{};return `<tr><td>${x.name}<br>${v.status==='yes'?'回報存在':v.status==='no'?'回報無':'待確認'}</td><td>${v.status==='yes'?escape(x.action):v.status==='no'?'持續維持並依需要再評估。':'補充病史／資料以確認。'}${v.plan?`<br><strong>計畫狀態：</strong>${escape(v.plan)}`:''}</td><td>${escape(v.owner)||'未指定'}</td><td>${escape(v.date)||'未安排'}</td></tr>`}).join('')}</tbody></table></div><p class="hint">${sourceLink(8)}</p></section><div class="alert">沒有正式認知測驗、神經學檢查及完整鑑別時，不能確診失智或排除可治療病因。本工具尚未經臨床效能驗證。</div>`;}
 function sources(){return heading('準則與限制','每個結果都有來源；網站規則不等同正式量表或完整準則。')+`<section class="panel"><h3>使用界線</h3><ul><li>原創中文病史整理問句，未重製 MoCA、MMSE、AD8 或其他正式量表；不宣稱有診斷敏感度或特異度。</li><li>本版本涵蓋常見鑑別方向，並非所有失智症病因，也不提供自動診斷、藥物選擇或療效預測。</li><li>正常認知篩檢、正常 CT／MRI 或沒有典型記憶症狀，均不能單獨排除失智／AD。</li><li>DLB、bvFTD 等只做部分特徵核對；完整門檻、排除條件、病理與混合病因須由專科評估。</li><li>視聽、教育、語言、文化及精神症狀會影響認知測試解讀。</li><li>AD 的生物學診斷與臨床症候群分開。2025 血液生物標記指引適用於專科、有客觀認知障礙者；triage 檢測至少需 90% 敏感度／75% 特異度，取代 PET／CSF 的檢測至少需兩者 90%。不是所有血液測試均符合；需考量腎功能等共病與特定檢測的效能。</li><li>Lancet 的生命階段與人口可歸因比例不是個人預測模型，不能由勾選數目推算機率。</li></ul></section><section class="panel"><h3>原始指引與共識</h3><ol class="sources-list">${DG.sources.map(([name,url,desc])=>`<li><a href="${url}" target="_blank" rel="noopener noreferrer">${name}</a><p>${desc}</p></li>`).join('')}</ol><p class="hint">來源查核日期：2026-10-11。年份為原始發布版本；較早年份不代表已被新準則取代，公開臨床使用前仍需專科內容審查與定期更新。</p></section><section class="panel"><h3>隱私與資料操作</h3><p>資料僅留在目前頁面的記憶體；重新整理或關閉頁面即清除。沒有登入、伺服器、分析追蹤或自動儲存。匯出與列印是您主動選擇的動作，檔案可能包含敏感資訊，請使用醫院核准的儲存方式。</p><p>網站不收集姓名、病歷號。自由文字仍可能包含個資；請自行去識別化。外部來源連結會另開網站。</p></section>`;}
 const renderers={safety,cognition,differential,risks,report,sources};
 function progress(id){const qs=DG.sections[id]?.filter(q=>!q.clinical||state.mode==='clinical');if(qs)return [qs.filter(q=>['yes','no'].includes(state.answers[q.id])).length,qs.length];if(id==='risks')return [DG.risks.filter(x=>['yes','no'].includes(state.risks[x.id]?.status)).length,14];return null;}
 function render(){document.getElementById('navigation').innerHTML=pages.map(([id,t,i])=>{const pr=progress(id);return `<button data-nav="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(i)}<span>${t}</span>${pr?`<span class="count" aria-label="已回答 ${pr[0]}／${pr[1]}">${pr[0]}/${pr[1]}</span>`:''}</button>`;}).join('');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));main.innerHTML=renderers[page]();}
 function navigate(p){if(!renderers[p])return;page=p;render();main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
 function notice(message){document.getElementById('notice').textContent=message;}
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.action==='start-evaluation'){const section=document.getElementById('safety-check');section?.scrollIntoView({block:'start',behavior:'instant'});section?.focus({preventScroll:true});return;}
  if(b.dataset.nav){navigate(b.dataset.nav);return;}
  if(b.dataset.mode){state.mode=b.dataset.mode;render();notice('已切換模式。民眾模式不使用專業評估欄位。');return;}
  if(b.dataset.kind){const {key,value,kind}=b.dataset;if(kind==='answer')state.answers[key]=value;else if(kind==='workup')state.workup[key]=value;else state.risks[key]={...state.risks[key],status:value};const y=window.scrollY;render();window.scrollTo(0,y);main.querySelector(`[data-kind="${kind}"][data-key="${key}"][data-value="${value}"]`)?.focus({preventScroll:true});return;}
  if(b.dataset.action==='print'){window.print();return;}
  if(b.dataset.action==='export'){const blob=new Blob([JSON.stringify({schema:'dementia-guide-v1',version:VERSION,...state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`認知照護評估-${new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'})}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);saved=JSON.stringify(state);notice('已下載。請保管評估檔案並避免放在公用電腦。');return;}
  if(b.dataset.action==='import'){document.getElementById('import-file').click();return;}
  if(b.dataset.action==='reset'&&window.confirm('清除目前頁面所有評估與追蹤資料？已下載的檔案不會被刪除。')){state=blank(state.mode);navigate('safety');notice('本次資料已清除。');}
 });
 document.addEventListener('input',e=>{const el=e.target;if(el.dataset.meta){const v=el.value;if(el.dataset.meta==='age'){const ok=v===''||(/^\d{1,3}$/.test(v)&&Number(v)<=120);el.setCustomValidity(ok?'':'請輸入 0 至 120 的整數歲數。');if(!ok){delete state.meta.age;el.reportValidity();return;}}state.meta[el.dataset.meta]=v;}if(el.dataset.risk)state.risks[el.dataset.risk]={...state.risks[el.dataset.risk],[el.dataset.prop]:el.value};});
 function validateImport(d){if(!d||d.schema!=='dementia-guide-v1'||!['public','clinical'].includes(d.mode))throw Error('檔案格式或版本不相符。');const out=blank(d.mode);const isRecord=v=>v&&typeof v==='object'&&!Array.isArray(v);if(!isRecord(d.answers)||!isRecord(d.risks)||!isRecord(d.meta)||(d.workup!==undefined&&!isRecord(d.workup)))throw Error('評估資料結構不正確。');for(const w of DG.workup){const v=d.workup?.[w.id];if(v===undefined)continue;if(!['pending','normal','abnormal'].includes(v))throw Error('檢查結果不正確。');out.workup[w.id]=v;}for(const q of Object.values(DG.sections).flat()){const v=d.answers[q.id];if(v!==undefined){if(!['yes','no','unknown'].includes(v))throw Error('問句回答不正確。');out.answers[q.id]=v;}}
  for(const r of DG.risks){const v=d.risks[r.id];if(v===undefined)continue;if(!isRecord(v))throw Error('危險因子資料不正確。');const n={};if(v.status!==undefined){if(!['yes','no','unknown'].includes(v.status))throw Error('危險因子狀態不正確。');n.status=v.status;}for(const p of ['plan','owner','date'])if(v[p]!==undefined){if(typeof v[p]!=='string'||v[p].length>(p==='plan'?800:100))throw Error('文字資料超出限制。');if(p==='date'&&v[p]&&!/^\d{4}-\d{2}-\d{2}$/.test(v[p]))throw Error('日期格式不正確。');n[p]=v[p];}out.risks[r.id]=n;}
  for(const k of ['age','onset','observer','notes'])if(d.meta[k]!==undefined){const v=d.meta[k];if(typeof v!=='string'||v.length>2000)throw Error('摘要格式不正確。');if(k==='age'&&v&&(!/^\d+$/.test(v)||Number(v)>120))throw Error('年齡不正確。');out.meta[k]=v;}return out;
 }
 document.addEventListener('change',async e=>{if(e.target.id!=='import-file')return;const file=e.target.files[0];if(!file)return;try{if(file.size>200000)throw Error('檔案過大（上限 200 KB）。');const imported=validateImport(JSON.parse(await file.text()));if(!window.confirm('匯入將取代目前頁面的評估資料，是否繼續？'))return;state=imported;render();notice('已匯入評估資料；仍需核對紀錄來源。');}catch(err){notice('匯入失敗：'+err.message);}finally{e.target.value='';}});
 const hasData=()=>[state.answers,state.risks,state.meta,state.workup].some(o=>Object.values(o).some(v=>v&&(typeof v!=='object'||Object.values(v).some(Boolean))));
 let saved=JSON.stringify(state);
 window.addEventListener('beforeunload',e=>{if(hasData()&&JSON.stringify(state)!==saved){e.preventDefault();e.returnValue='';}});
 render();
})();
</script></body></html>
